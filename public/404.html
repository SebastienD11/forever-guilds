<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Page not found | Forever Guilds</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=DM+Sans:wght@400;600&display=swap");

      :root {
        font-family: "DM Sans", Arial, sans-serif;
        color: #e8e0ce;
        background: #100e0b;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background:
          radial-gradient(ellipse at 20% 0%, #2c2419 0, transparent 32%),
          #100e0b;
      }
      .lost {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        position: relative;
        overflow: hidden;
      }
      .lost::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          repeating-linear-gradient(
            90deg,
            transparent 0 96px,
            rgba(216, 172, 91, 0.025) 97px 98px
          ),
          repeating-linear-gradient(
            0deg,
            transparent 0 96px,
            rgba(216, 172, 91, 0.02) 97px 98px
          );
      }
      .lost-inner {
        position: relative;
        width: min(680px, 100%);
        text-align: center;
      }
      .crest {
        width: 104px;
        height: 104px;
        margin: 0 auto 34px;
        display: grid;
        place-items: center;
        border: 1px solid #8a6b3d;
        background: radial-gradient(circle at 50% 42%, #3a3b2e, #141a16 70%);
        color: #e0be78;
        font-size: 44px;
        box-shadow:
          0 0 0 6px #14110c,
          0 0 32px rgba(167, 114, 41, 0.22);
      }
      .crest span {
        text-shadow: 0 2px 12px #000;
      }
      .eyebrow {
        display: inline-block;
        font: 600 11px "Cinzel", Georgia, serif;
        letter-spacing: 0.24em;
        color: #d9b16c;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 18px;
        font: 700 clamp(44px, 8vw, 72px) / 1.08 "Cinzel", Georgia, serif;
        letter-spacing: -0.02em;
        color: #f6ebd5;
        text-shadow: 0 2px 19px #000;
      }
      .lost-inner > p {
        margin: 0 auto 30px;
        max-width: 480px;
        font-size: 16px;
        line-height: 1.8;
        color: #b7aea0;
      }
      .lost-actions {
        display: flex;
        justify-content: center;
      }
      .lost-actions .primary {
        background: linear-gradient(180deg, #3b4742, #222c28);
        border: 1px solid #6d5a33;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 4px 14px rgba(0, 0, 0, 0.45);
        color: #f5ecd6;
        min-height: 51px;
        font: 600 12px "Cinzel", Georgia, serif;
        letter-spacing: 0.04em;
        text-decoration: none;
        padding: 8px 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: filter 0.1s;
      }
      .lost-actions .primary:hover {
        filter: brightness(1.12);
      }
      .lost-actions .primary:active {
        filter: brightness(0.8);
        transform: scale(0.96);
      }
      .rune {
        position: absolute;
        color: #b99347;
        opacity: 0.7;
        user-select: none;
      }
      .rune-one {
        top: 22%;
        left: 12%;
        font-size: 18px;
        transform: rotate(-14deg);
      }
      .rune-two {
        bottom: 24%;
        right: 14%;
        font-size: 14px;
      }
      .rune-three {
        top: 14%;
        right: 26%;
        font-size: 11px;
        opacity: 0.4;
      }
      @media (max-width: 480px) {
        .lost-actions a {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="lost">
      <span class="rune rune-one" aria-hidden="true">✦</span>
      <span class="rune rune-two" aria-hidden="true">✧</span>
      <span class="rune rune-three" aria-hidden="true">✦</span>
      <div class="lost-inner">
        <div class="crest" aria-hidden="true">
          <span>✧</span>
        </div>
        <span class="eyebrow">LOST IN THE OLD WORLD</span>
        <h1>This path leads nowhere.</h1>
        <p>
          The guild you were looking for may have been removed, or the link is
          broken. Your old banner is still out there.
        </p>
        <div class="lost-actions">
          <a class="primary" href="/">Return to the archive</a>
        </div>
      </div>
    </div>
  </body>
</html>
